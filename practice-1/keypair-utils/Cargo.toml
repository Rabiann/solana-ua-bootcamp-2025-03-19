[[bin]]
name = "check_balance"
path = "src/bin/check_balance.rs"

[[bin]]
name = "gen_keypair"
path = "src/bin/gen_keypair.rs"

[[bin]]
name = "load_keypair"
path = "src/bin/load_keypair.rs"

[package]
name = "keypair-utils"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.97"
dotenvy = "0.15.7"
rand = { version = "0.9.0", features = ["std_rng"] }
serde_json = "1.0.140"
solana-client = "2.2.6"
solana-sdk = { version="2.2.2", features = ["full"] }
thiserror = "2.0.12"
